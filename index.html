<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Warrior</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* 手繪筆記風：麥克筆字體 + 筆記本白底 */
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Permanent+Marker&display=swap');

      /* 自訂中文字體：手寫風（請將 .ttf 放在 public/fonts/） */
      @font-face {
        font-family: 'Handwriting Chinese';
        src: url('/fonts/HandwritingChinese.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --notebook-bg: #fffef7;
        --notebook-paper: #faf8f0;
        --marker-black: #1a1a1a;
        --hand-drawn-font: 'Handwriting Chinese', 'Permanent Marker', 'Noto Sans TC', cursive;
        --content-font: 'Noto Sans TC', sans-serif;
      }

      body {
        font-family: var(--content-font);
        background-color: var(--notebook-bg);
        color: var(--marker-black);
        overflow: hidden;
      }

      /* 手繪風：粗黑框、微歪斜 */
      .hand-drawn-box {
        background: var(--notebook-paper);
        border: 4px solid var(--marker-black);
        box-shadow: 2px 2px 0 var(--marker-black);
        transform: rotate(-0.4deg);
      }
      .hand-drawn-box-inner {
        transform: rotate(0.4deg);
      }
      .hand-drawn-font {
        font-family: var(--hand-drawn-font);
        color: var(--marker-black);
        letter-spacing: 0.02em;
      }
      .hand-drawn-btn {
        font-family: var(--hand-drawn-font);
        background: var(--notebook-paper);
        border: 4px solid var(--marker-black);
        color: var(--marker-black);
        box-shadow: 3px 3px 0 var(--marker-black);
        transform: rotate(-0.3deg);
      }
      .hand-drawn-btn:hover { filter: brightness(0.96); }
      .hand-drawn-btn:active { transform: rotate(-0.3deg) translateY(2px); box-shadow: 1px 1px 0 var(--marker-black); }
      .hand-drawn-btn:disabled,
      .hand-drawn-btn.btn-disabled {
        background: #e5e7eb;
        border-color: #9ca3af;
        color: #6b7280;
        box-shadow: 2px 2px 0 #9ca3af;
        cursor: not-allowed;
        pointer-events: none;
      }

      /* Pixel Art Animations */
      @keyframes shake {
        0% { transform: translate(4px, 0px); }
        25% { transform: translate(-4px, 0px); }
        50% { transform: translate(4px, 0px); }
        75% { transform: translate(-4px, 0px); }
        100% { transform: translate(0px, 0px); }
      }

      .shake-animation {
        animation: shake 0.3s steps(4) infinite; /* steps for jerky retro feel */
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }

      .float-animation {
        animation: float 2s steps(8) infinite;
      }

      @keyframes slash {
        0% { transform: scale(0) rotate(-45deg); opacity: 0; }
        50% { transform: scale(1.5) rotate(0deg); opacity: 1; }
        100% { transform: scale(1) rotate(45deg); opacity: 0; }
      }
      
      .slash-effect {
        animation: slash 0.3s ease-out forwards;
      }

      /* Fire Effect */
      @keyframes burn {
        0% { text-shadow: 0 0 4px #ff0000, 0 -5px 4px #ffaa00, 2px -10px 6px #ffcc00, -2px -15px 11px #ff8800; }
        50% { text-shadow: 0 0 4px #ff0000, -2px -6px 5px #ffaa00, 3px -12px 8px #ffcc00, -4px -18px 12px #ff8800; }
        100% { text-shadow: 0 0 4px #ff0000, 1px -4px 4px #ffaa00, -3px -11px 7px #ffcc00, 3px -16px 10px #ff8800; }
      }

      .fire-anim {
        color: #fff;
        animation: burn 0.4s infinite alternate;
      }

      .crit-scale {
        animation: crit-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes crit-pop {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1.2); opacity: 1; }
      }

      /* Pixel Borders Utility */
      .pixel-border {
        box-shadow: 
          -4px 0 0 0 black,
          4px 0 0 0 black,
          0 -4px 0 0 black,
          0 4px 0 0 black;
        margin: 4px;
      }
      
      .pixel-text {
        font-family: var(--pixel-font);
      }

      /* Scrollbar hiding for game board */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Phaser Canvas 專用樣式 - 確保可見 */
      #phaser-container {
        overflow: hidden;
      }
      
      #phaser-container canvas {
        display: block !important;
        position: relative !important;
        width: 100% !important;
        height: 100% !important;
        image-rendering: auto !important;
        opacity: 1 !important;
        visibility: visible !important;
        z-index: 1 !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
